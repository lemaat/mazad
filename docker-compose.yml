services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mazad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mazad2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mazad_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./mazad_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./mazad_backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: mazad_db
      DB_USER: postgres
      DB_PASSWORD: mazad2026
      REDIS_HOST: redis
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin: